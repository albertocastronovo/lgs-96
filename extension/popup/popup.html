<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title></title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="popup__header">
      <span class="popup__brand" id="popup-brand"></span>
      <span class="popup__subtitle" id="popup-subtitle"></span>
    </header>

    <p class="popup__disclaimer" id="popup-disclaimer"></p>

    <section class="popup__row">
      <label class="popup__row-label" for="language-select" id="language-label"></label>
      <select id="language-select" class="popup__select"></select>
    </section>

    <section class="popup__row">
      <label class="popup__row-label" for="cache-toggle" id="local-cache-label"></label>
      <label class="switch">
        <input type="checkbox" id="cache-toggle" role="switch" />
        <span class="switch__track"><span class="switch__thumb"></span></span>
      </label>
    </section>

    <section class="popup__row popup__row--disabled">
      <span class="popup__row-label" id="cloud-cache-label"
        ><span id="cloud-cache-text"></span><span class="popup__preview-tag" id="cloud-preview"></span></span
      >
      <span class="switch switch--disabled" aria-hidden="true">
        <span class="switch__track"><span class="switch__thumb"></span></span>
      </span>
    </section>

    <section class="popup__row popup__row--muted">
      <span id="cache-count"></span>
    </section>

    <button type="button" id="clear-cache" class="popup__button"></button>
  </main>

  <script src="../src/cache.js"></script>
  <script src="../src/localization.js"></script>
  <script src="popup.js"></script>
</body>
</html>
